name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}"...HEAD > /tmp/pr.diff
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/pr.diff', 'utf8');
            const findings = [];
            if (/localStorage/.test(diff) && /token/i.test(diff)) findings.push('Do not store auth tokens in localStorage');
            if (/NEXT_PUBLIC_.*SECRET|PASSWORD|PRIVATE_KEY/.test(diff)) findings.push('Secret-like NEXT_PUBLIC_ env var');
            if (/password.*hash|bcrypt|authorize|IsOwner/.test(diff)) findings.push('Possible business/auth logic in frontend — move to API');
            const body = findings.length
              ? `## AI review (heuristic)\n\n${findings.map(f => `- [ ] ${f}`).join('\n')}`
              : `## AI review (heuristic)\n\nNo high-risk FE patterns detected. Confirm UI-only + cookie credentials.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
